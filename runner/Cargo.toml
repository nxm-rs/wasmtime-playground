[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
# Use bleeding-edge wasmtime from GitHub with async component model support
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime.git", features = ["component-model", "component-model-async"] }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime.git" }
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12" }  # Removed "blocking" - using async!
